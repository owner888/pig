<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pig web</title>
  <style>
    :root {
      --bg: #0b0f17;
      --bg-sidebar: #0e131f;
      --border: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --user-bg: #121824;
      --user-border: #1e293b;
      --assistant-bg: #223044;
      --assistant-text: #f1f5f9;
      --btn-send: #5eead4;
      --btn-send-hover: #2dd4bf;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      height: 100vh;
      display: flex;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Sidebar for folder/session drawer */
    #sidebar {
      width: 300px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: transform 0.2s ease, width 0.2s ease;
      z-index: 50;
    }
    #sidebar.collapsed {
      width: 0;
      transform: translateX(-100%);
      overflow: hidden;
      border-right: none;
    }
    .sidebar-header {
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .back-btn {
      background: transparent;
      border: none;
      color: #38bdf8;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0;
      outline: none;
    }
    .back-btn:hover { text-decoration: underline; }
    .sidebar-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .drawer-item {
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 13px;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border: 1px solid transparent;
      transition: all 0.15s;
    }
    .drawer-item:hover {
      background: rgba(51, 65, 85, 0.4);
      border-color: var(--border);
    }
    .drawer-item.active {
      background: #1e293b;
      border-color: #38bdf8;
      color: #38bdf8;
    }
    .drawer-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }
    .drawer-badge {
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-dim);
      background: rgba(15, 23, 42, 0.6);
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* Main Chat View */
    #main-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
      position: relative;
    }

    /* Header matching pi-web */
    .top-header {
      padding: 12px 20px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      flex-shrink: 0;
      font-family: var(--font-mono);
      font-size: 13px;
    }
    .path-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
      color: var(--text-dim);
      overflow: hidden;
    }
    .path-cwd { color: var(--text-muted); }
    .path-file {
      color: var(--text-dim);
      font-size: 12px;
      text-overflow: ellipsis;
      overflow: hidden;
      white-space: nowrap;
    }
    .toggle-sidebar-btn {
      background: #182232;
      border: 1px solid var(--border);
      color: var(--text-muted);
      width: 32px;
      height: 32px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
    }
    .toggle-sidebar-btn:hover { color: var(--text); border-color: #475569; }

    /* Messages container */
    #chat-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 10px 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    .msg-block {
      width: 100%;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 15px;
      line-height: 1.6;
      word-break: break-word;
      animation: fadeIn 0.15s ease-out;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }

    .msg-user {
      background: var(--user-bg);
      border: 1px solid var(--user-border);
      color: var(--text);
      white-space: pre-wrap;
    }

    .msg-assistant {
      background: var(--assistant-bg);
      color: var(--assistant-text);
    }

    /* Thinking block inside assistant */
    .thinking-box {
      background: rgba(0, 0, 0, 0.25);
      border-left: 2px solid #64748b;
      padding: 8px 12px;
      margin-bottom: 12px;
      border-radius: 4px;
      font-size: 13px;
      color: #94a3b8;
      font-style: italic;
    }
    .thinking-box summary {
      cursor: pointer;
      font-weight: 500;
      color: #cbd5e1;
      user-select: none;
      list-style: none;
    }
    .thinking-box summary::-webkit-details-marker { display: none; }
    .thinking-box summary::before { content: "▶ "; font-size: 10px; display: inline-block; transition: transform 0.15s; }
    .thinking-box[open] summary::before { transform: rotate(90deg); }
    .thinking-content { white-space: pre-wrap; margin-top: 6px; }

    /* Tool execution cards */
    .tool-card {
      background: rgba(11, 15, 23, 0.6);
      border: 1px solid var(--border);
      border-radius: 6px;
      margin: 10px 0;
      font-family: var(--font-mono);
      font-size: 13px;
      overflow: hidden;
    }
    .tool-header {
      padding: 6px 12px;
      background: rgba(30, 41, 59, 0.5);
      display: flex;
      justify-content: space-between;
      color: var(--text-muted);
    }
    .tool-body {
      padding: 10px 12px;
      color: var(--text);
      white-space: pre-wrap;
      max-height: 260px;
      overflow-y: auto;
    }

    /* Prose / Markdown */
    .prose p { margin-bottom: 0.75em; }
    .prose p:last-child { margin-bottom: 0; }
    .prose pre {
      background: #090d16;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 10px 14px;
      margin: 8px 0;
      overflow-x: auto;
      font-family: var(--font-mono);
      font-size: 13px;
    }
    .prose code {
      font-family: var(--font-mono);
      background: rgba(15, 23, 42, 0.4);
      padding: 2px 5px;
      border-radius: 4px;
      font-size: 0.9em;
    }
    .prose pre code { background: transparent; padding: 0; font-size: inherit; }

    /* Bottom Control Bar matching pi-web */
    .bottom-panel {
      padding: 8px 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-shrink: 0;
    }
    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 12px;
    }
    .selectors-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .select-pill {
      background: #121824;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-family: var(--font-mono);
      outline: none;
      cursor: pointer;
    }
    .select-pill:focus { border-color: #38bdf8; }
    .status-telemetry {
      color: var(--text-dim);
    }

    /* Input row matching pi-web */
    .input-box-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    .input-wrapper {
      flex: 1;
      background: #121824;
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      align-items: center;
      padding: 2px 12px;
      transition: border-color 0.15s;
    }
    .input-wrapper:focus-within { border-color: #38bdf8; }
    #prompt-input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5;
      padding: 10px 0;
      resize: none;
      min-height: 42px;
      max-height: 160px;
      outline: none;
    }
    .action-btn {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid transparent;
      cursor: pointer;
      outline: none;
      font-size: 15px;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .btn-attach {
      background: #182232;
      border-color: var(--border);
      color: var(--text-muted);
    }
    .btn-attach:hover { color: var(--text); }
    .btn-send {
      background: #5eead4;
      color: #0f172a;
    }
    .btn-send:hover { background: #2dd4bf; }
    .btn-stop {
      background: #1e293b;
      border-color: var(--border);
      color: #ef4444;
      display: none;
    }
    .btn-stop:hover { background: #334155; }
  </style>
</head>
<body>

  <!-- Left Drawer: Folders & Sessions -->
  <aside id="sidebar" class="collapsed">
    <div id="sidebar-header" class="sidebar-header">
      <span id="sidebar-title">Workspaces</span>
      <span id="sidebar-subtitle" style="font-size:11px; color:var(--text-dim);">directories</span>
    </div>
    <div id="sidebar-list" class="sidebar-scroll"></div>
  </aside>

  <!-- Main View -->
  <main id="main-view">
    <div class="top-header">
      <div class="path-info">
        <span id="cwd-display" class="path-cwd">~</span>
        <span id="filename-display" class="path-file">Loading session...</span>
      </div>
      <button id="toggle-sidebar" class="toggle-sidebar-btn" title="Toggle Sidebar">‹</button>
    </div>

    <div id="chat-scroll"></div>

    <div class="bottom-panel">
      <!-- Selectors & Telemetry Row matching pi-web -->
      <div class="controls-row">
        <div class="selectors-group">
          <select id="provider-select" class="select-pill"><option>antigravity</option></select>
          <select id="model-select" class="select-pill"><option>gemini-3.8-flash</option></select>
          <select id="thinking-select" class="select-pill">
            <option value="off">off</option>
            <option value="low">low</option>
            <option value="medium" selected>medium</option>
            <option value="high">high</option>
          </select>
        </div>
        <div id="telemetry-stats" class="status-telemetry">↑0 ↓0 $0.00 0%/1.0M</div>
      </div>

      <!-- Input box & actions -->
      <div class="input-box-row">
        <div class="input-wrapper">
          <textarea id="prompt-input" rows="1" placeholder="send a message..."></textarea>
        </div>
        <button id="attach-btn" class="action-btn btn-attach" title="Attach file or image">📎</button>
        <button id="send-btn" class="action-btn btn-send" title="Send message">➔</button>
        <button id="stop-btn" class="action-btn btn-stop" title="Stop (Escape)">■</button>
      </div>
    </div>
  </main>

  <script>
    const chatScroll = document.getElementById("chat-scroll");
    const promptInput = document.getElementById("prompt-input");
    const sendBtn = document.getElementById("send-btn");
    const stopBtn = document.getElementById("stop-btn");
    const toggleSidebar = document.getElementById("toggle-sidebar");
    const sidebar = document.getElementById("sidebar");
    const sidebarHeader = document.getElementById("sidebar-header");
    const sidebarList = document.getElementById("sidebar-list");
    const cwdDisplay = document.getElementById("cwd-display");
    const filenameDisplay = document.getElementById("filename-display");
    const telemetryStats = document.getElementById("telemetry-stats");
    const modelSelect = document.getElementById("model-select");
    const thinkingSelect = document.getElementById("thinking-select");

    let isRunning = false;
    let currentAssistantBlock = null;
    let currentAssistantText = "";
    let currentThinkingText = "";
    let currentThinkingBox = null;

    let currentView = "workspaces"; // "workspaces" | "sessions"
    let selectedWorkspace = null;

    // Sidebar Toggle
    toggleSidebar.addEventListener("click", () => {
      sidebar.classList.toggle("collapsed");
      toggleSidebar.innerText = sidebar.classList.contains("collapsed") ? "›" : "‹";
      if (!sidebar.classList.contains("collapsed") && currentView === "workspaces") {
        loadWorkspaces();
      }
    });

    // Auto-grow textarea
    promptInput.addEventListener("input", () => {
      promptInput.style.height = "auto";
      promptInput.style.height = Math.min(promptInput.scrollHeight, 160) + "px";
    });

    promptInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        submitMessage();
      } else if (e.key === "Escape" && isRunning) {
        e.preventDefault();
        abortTurn();
      }
    });

    sendBtn.addEventListener("click", submitMessage);
    stopBtn.addEventListener("click", abortTurn);

    function setRunningState(running) {
      isRunning = running;
      if (running) {
        sendBtn.style.display = "none";
        stopBtn.style.display = "flex";
      } else {
        sendBtn.style.display = "flex";
        stopBtn.style.display = "none";
      }
    }

    function renderMarkdown(md) {
      let html = md
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/```([a-zA-Z0-9_\-\+\.]*)\n([\s\S]*?)```/g, (m, lang, code) => {
          return `<pre><code class="language-${lang}">${code.trim()}</code></pre>`;
        })
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/^### (.*$)/gim, "<h3>$1</h3>")
        .replace(/^## (.*$)/gim, "<h2>$1</h2>")
        .replace(/^# (.*$)/gim, "<h1>$1</h1>")
        .replace(/\n\n/g, "</p><p>");
      return `<p>${html}</p>`;
    }

    function appendUserMessage(text) {
      const block = document.createElement("div");
      block.className = "msg-block msg-user";
      block.innerText = text;
      chatScroll.appendChild(block);
      chatScroll.scrollTop = chatScroll.scrollHeight;
    }

    function ensureAssistantBlock() {
      if (!currentAssistantBlock) {
        currentAssistantBlock = document.createElement("div");
        currentAssistantBlock.className = "msg-block msg-assistant prose";
        chatScroll.appendChild(currentAssistantBlock);
      }
      return currentAssistantBlock;
    }

    // SSE Stream
    function initEvents() {
      const es = new EventSource("/api/events");
      es.onmessage = (e) => {
        try {
          const evt = JSON.parse(e.data);
          onEvent(evt);
        } catch (err) {}
      };
      es.onerror = () => setTimeout(initEvents, 2000);
    }

    function onEvent(evt) {
      if (evt.type === "agent_start" || evt.type === "turn_start") {
        setRunningState(true);
      } else if (evt.type === "agent_end" || evt.type === "turn_end") {
        setRunningState(false);
        currentAssistantBlock = null;
        currentAssistantText = "";
        currentThinkingText = "";
        currentThinkingBox = null;
        refreshState();
      } else if (evt.type === "thinking_delta") {
        currentThinkingText += evt.delta || "";
        const box = ensureAssistantBlock();
        if (!currentThinkingBox) {
          currentThinkingBox = document.createElement("details");
          currentThinkingBox.className = "thinking-box";
          currentThinkingBox.open = true;
          currentThinkingBox.innerHTML = "<summary>Thinking...</summary><div class=\"thinking-content\"></div>";
          box.insertBefore(currentThinkingBox, box.firstChild);
        }
        currentThinkingBox.querySelector(".thinking-content").innerText = currentThinkingText;
        chatScroll.scrollTop = chatScroll.scrollHeight;
      } else if (evt.type === "text_delta") {
        currentAssistantText += evt.delta || "";
        const box = ensureAssistantBlock();
        let prose = box.querySelector(".assistant-prose");
        if (!prose) {
          prose = document.createElement("div");
          prose.className = "assistant-prose";
          box.appendChild(prose);
        }
        prose.innerHTML = renderMarkdown(currentAssistantText);
        chatScroll.scrollTop = chatScroll.scrollHeight;
      } else if (evt.type === "tool_execution_start") {
        const box = ensureAssistantBlock();
        const card = document.createElement("div");
        card.id = `tool-${evt.toolCallId}`;
        card.className = "tool-card";
        card.innerHTML = `<div class="tool-header"><span>${evt.toolName}</span><span>Running...</span></div><div class="tool-body">${JSON.stringify(evt.arguments || {}, null, 2)}</div>`;
        box.appendChild(card);
        chatScroll.scrollTop = chatScroll.scrollHeight;
      } else if (evt.type === "tool_execution_end") {
        const card = document.getElementById(`tool-${evt.toolCallId}`);
        if (card) {
          card.querySelector(".tool-header span:last-child").innerText = evt.isError ? "Failed" : "Done";
          card.querySelector(".tool-body").innerText = typeof evt.result === "string" ? evt.result : JSON.stringify(evt.result || {}, null, 2);
        }
      } else if (evt.type === "session_info_changed") {
        refreshState();
      }
    }

    async function submitMessage() {
      const text = promptInput.value.trim();
      if (!text) return;
      promptInput.value = "";
      promptInput.style.height = "42px";
      appendUserMessage(text);
      setRunningState(true);

      await fetch("/api/prompt", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text }),
      });
    }

    async function abortTurn() {
      await fetch("/api/abort", { method: "POST" });
    }

    async function refreshState() {
      try {
        const res = await fetch("/api/state");
        const d = await res.json();
        cwdDisplay.innerText = d.cwd || "~";
        filenameDisplay.innerText = d.sessionFile || d.sessionName || "Active Session";
        telemetryStats.innerText = `↑${formatK(d.tokensIn)} ↓${formatK(d.tokensOut)} $${d.cost} ${d.contextPercent}%/${d.contextWindow}`;
      } catch (err) {}
    }

    function formatK(n) {
      if (n < 1000) return n;
      if (n < 1000000) return (n / 1000).toFixed(1) + "k";
      return (n / 1000000).toFixed(1) + "M";
    }

    // 1. Level 1: Workspaces/Directories
    async function loadWorkspaces() {
      currentView = "workspaces";
      sidebarHeader.innerHTML = `
        <span style="font-weight:600;">Workspaces</span>
        <span style="font-size:11px; color:var(--text-dim);">directories</span>
      `;
      sidebarList.innerHTML = `<div style="padding:12px; color:var(--text-dim); font-size:12px;">Loading directories...</div>`;

      try {
        const res = await fetch("/api/folders");
        const data = await res.json();
        sidebarList.innerHTML = "";

        for (const ws of data.workspaces || []) {
          const item = document.createElement("div");
          item.className = "drawer-item" + (ws.isCurrent ? " active" : "");
          item.innerHTML = `
            <span class="drawer-label" title="${ws.path}">${ws.name}</span>
            <span class="drawer-badge">${ws.sessionCount} sessions</span>
          `;
          item.addEventListener("click", () => enterWorkspace(ws));
          sidebarList.appendChild(item);
        }
      } catch (err) {
        sidebarList.innerHTML = `<div style="padding:12px; color:var(--error); font-size:12px;">Failed to load folders</div>`;
      }
    }

    // 2. Level 2: Sessions under chosen workspace
    async function enterWorkspace(ws) {
      currentView = "sessions";
      selectedWorkspace = ws;
      sidebarHeader.innerHTML = `
        <button id="back-folders" class="back-btn">‹ Workspaces</button>
        <span style="font-size:12px; font-weight:600; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${ws.name}</span>
      `;
      document.getElementById("back-folders").addEventListener("click", loadWorkspaces);

      sidebarList.innerHTML = `<div style="padding:12px; color:var(--text-dim); font-size:12px;">Loading sessions...</div>`;

      try {
        const res = await fetch(`/api/sessions?cwd=${encodeURIComponent(ws.path)}`);
        const sessions = await res.json();
        sidebarList.innerHTML = "";

        if (sessions.length === 0) {
          sidebarList.innerHTML = `<div style="padding:12px; color:var(--text-dim); font-size:12px;">No sessions in this folder</div>`;
          return;
        }

        for (const s of sessions) {
          const item = document.createElement("div");
          item.className = "drawer-item";
          item.innerHTML = `
            <span class="drawer-label" title="${s.filename}">${s.opening || s.filename}</span>
          `;
          item.addEventListener("click", () => switchSession(s.path, s.filename, ws.path));
          sidebarList.appendChild(item);
        }
      } catch (err) {
        sidebarList.innerHTML = `<div style="padding:12px; color:var(--error); font-size:12px;">Failed to load sessions</div>`;
      }
    }

    async function switchSession(path, filename, cwd) {
      filenameDisplay.innerText = filename;
      chatScroll.innerHTML = "";
      await fetch("/api/session/switch", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ path }),
      });
      loadMessages();
      refreshState();
    }

    async function loadMessages() {
      try {
        const res = await fetch("/api/messages");
        const msgs = await res.json();
        chatScroll.innerHTML = "";
        for (const m of msgs) {
          if (m.role === "user") {
            const text = typeof m.content === "string" ? m.content : (m.content?.[0]?.text || "");
            appendUserMessage(text);
          } else if (m.role === "assistant") {
            const text = m.content?.filter(c => c.type === "text").map(c => c.text).join("") || "";
            if (text) {
              const block = document.createElement("div");
              block.className = "msg-block msg-assistant prose";
              block.innerHTML = renderMarkdown(text);
              chatScroll.appendChild(block);
            }
          }
        }
      } catch (err) {}
    }

    initEvents();
    refreshState();
    loadMessages();
  </script>
</body>
</html>
