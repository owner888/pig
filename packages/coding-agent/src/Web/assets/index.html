<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pig web</title>
  <style>
    :root {
      --bg: #0b0f17;
      --bg-sidebar: #0e131f;
      --border: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --user-bg: #121824;
      --user-border: #1e293b;
      --assistant-bg: #223044;
      --assistant-text: #f1f5f9;
      --btn-send: #5eead4;
      --btn-send-hover: #2dd4bf;
      --diff-add-bg: rgba(34, 197, 94, 0.15);
      --diff-add-text: #4ade80;
      --diff-del-bg: rgba(239, 68, 68, 0.15);
      --diff-del-text: #f87171;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      height: 100vh;
      display: flex;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Sidebar for folder/session drawer */
    #sidebar {
      width: 300px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: transform 0.2s ease, width 0.2s ease;
      z-index: 50;
    }
    #sidebar.collapsed {
      width: 0;
      transform: translateX(-100%);
      overflow: hidden;
      border-right: none;
    }
    .sidebar-header {
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .back-btn {
      background: transparent;
      border: none;
      color: #38bdf8;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0;
      outline: none;
    }
    .back-btn:hover { text-decoration: underline; }
    .sidebar-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .drawer-item {
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 13px;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border: 1px solid transparent;
      transition: all 0.15s;
    }
    .drawer-item:hover {
      background: rgba(51, 65, 85, 0.4);
      border-color: var(--border);
    }
    .drawer-item.active {
      background: #1e293b;
      border-color: #38bdf8;
      color: #38bdf8;
    }
    .drawer-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }
    .drawer-badge {
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-dim);
      background: rgba(15, 23, 42, 0.6);
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* Main Chat View */
    #main-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
      position: relative;
    }

    /* Header matching pi-web */
    .top-header {
      padding: 12px 20px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      flex-shrink: 0;
      font-family: var(--font-mono);
      font-size: 13px;
    }
    .path-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
      color: var(--text-dim);
      overflow: hidden;
    }
    .path-cwd { color: var(--text-muted); }
    .path-file {
      color: var(--text-dim);
      font-size: 12px;
      text-overflow: ellipsis;
      overflow: hidden;
      white-space: nowrap;
    }
    .toggle-sidebar-btn {
      background: #182232;
      border: 1px solid var(--border);
      color: var(--text-muted);
      width: 32px;
      height: 32px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
    }
    .toggle-sidebar-btn:hover { color: var(--text); border-color: #475569; }

    /* Top Status/Notification Banner */
    .status-banner {
      background: rgba(56, 189, 248, 0.15);
      border-bottom: 1px solid rgba(56, 189, 248, 0.3);
      color: #38bdf8;
      padding: 6px 16px;
      font-size: 12px;
      font-family: var(--font-mono);
      display: flex;
      align-items: center;
      justify-content: space-between;
      animation: fadeIn 0.15s ease-out;
    }

    /* Messages container */
    #chat-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 10px 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    .msg-block {
      width: 100%;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 15px;
      line-height: 1.6;
      word-break: break-word;
      animation: fadeIn 0.15s ease-out;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }

    .msg-user {
      background: var(--user-bg);
      border: 1px solid var(--user-border);
      color: var(--text);
    }
    .msg-user-text { white-space: pre-wrap; }

    .msg-assistant {
      background: var(--assistant-bg);
      color: var(--assistant-text);
    }

    .msg-error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      font-family: var(--font-mono);
      font-size: 13px;
    }

    /* Images grid in message */
    .msg-images-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }
    .msg-image-thumb {
      max-width: 240px;
      max-height: 160px;
      border-radius: 6px;
      border: 1px solid var(--border);
      cursor: pointer;
      object-fit: cover;
      transition: transform 0.15s;
    }
    .msg-image-thumb:hover { transform: scale(1.02); border-color: #38bdf8; }

    /* Thinking block inside assistant */
    .thinking-box {
      background: rgba(0, 0, 0, 0.25);
      border-left: 2px solid #64748b;
      padding: 8px 12px;
      margin-bottom: 12px;
      border-radius: 4px;
      font-size: 13px;
      color: #94a3b8;
      font-style: italic;
    }
    .thinking-box summary {
      cursor: pointer;
      font-weight: 500;
      color: #cbd5e1;
      user-select: none;
      list-style: none;
    }
    .thinking-box summary::-webkit-details-marker { display: none; }
    .thinking-box summary::before { content: "▶ "; font-size: 10px; display: inline-block; transition: transform 0.15s; }
    .thinking-box[open] summary::before { transform: rotate(90deg); }
    .thinking-content { white-space: pre-wrap; margin-top: 6px; }

    /* Tool execution cards matching pi-web */
    .tool-card {
      width: 100%;
      background: #111827;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin: 4px 0;
      font-family: var(--font-mono);
      font-size: 13px;
      overflow: hidden;
      animation: fadeIn 0.15s ease-out;
    }
    .tool-header {
      padding: 10px 14px;
      background: rgba(30, 41, 59, 0.4);
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #94a3b8;
      cursor: pointer;
      user-select: none;
      font-size: 13px;
    }
    .tool-header:hover { background: rgba(51, 65, 85, 0.4); }
    .tool-header-title { font-weight: 500; color: #cbd5e1; }
    .tool-header-status { font-size: 11px; color: var(--text-dim); }
    .tool-body {
      padding: 12px 14px;
      background: #090d16;
      color: #e2e8f0;
      white-space: pre-wrap;
      max-height: 380px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.5;
      border-top: 1px solid rgba(30, 41, 59, 0.6);
    }
    .tool-terminal {
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.5;
      color: #cbd5e1;
      white-space: pre-wrap;
      word-break: break-all;
    }

    /* Diff View */
    .diff-container {
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.45;
    }
    .diff-line { padding: 1px 6px; white-space: pre-wrap; word-break: break-all; }
    .diff-add { background: var(--diff-add-bg); color: var(--diff-add-text); }
    .diff-del { background: var(--diff-del-bg); color: var(--diff-del-text); }
    .diff-ctx { color: var(--text-dim); }

    /* Prose / Markdown */
    .prose p { margin-bottom: 0.75em; }
    .prose p:last-child { margin-bottom: 0; }
    .prose pre {
      background: #090d16;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 10px 14px;
      margin: 8px 0;
      overflow-x: auto;
      font-family: var(--font-mono);
      font-size: 13px;
    }
    .prose code {
      font-family: var(--font-mono);
      background: rgba(15, 23, 42, 0.4);
      padding: 2px 5px;
      border-radius: 4px;
      font-size: 0.9em;
    }
    .prose pre code { background: transparent; padding: 0; font-size: inherit; }

    /* Pending images bar above input */
    .pending-images-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 6px 4px;
    }
    .pending-img-item {
      position: relative;
      display: inline-block;
    }
    .pending-img-thumb {
      width: 48px;
      height: 48px;
      border-radius: 6px;
      border: 1px solid #38bdf8;
      object-fit: cover;
    }
    .pending-img-del {
      position: absolute;
      top: -4px;
      right: -4px;
      background: #ef4444;
      color: #fff;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      font-size: 11px;
      line-height: 14px;
      text-align: center;
      cursor: pointer;
      font-weight: bold;
      border: 1px solid #0b0f17;
    }

    /* Bottom Control Bar matching pi-web */
    .bottom-panel {
      padding: 8px 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-shrink: 0;
    }
    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 12px;
    }
    .selectors-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .select-pill {
      background: #121824;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-family: var(--font-mono);
      outline: none;
      cursor: pointer;
      max-width: 220px;
    }
    .select-pill:focus { border-color: #38bdf8; }
    .status-telemetry {
      color: var(--text-dim);
    }

    /* Input row matching pi-web */
    .input-box-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    .input-wrapper {
      flex: 1;
      background: #121824;
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      padding: 4px 12px;
      transition: border-color 0.15s;
    }
    .input-wrapper:focus-within { border-color: #38bdf8; }
    #prompt-input {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5;
      padding: 8px 0;
      resize: none;
      min-height: 38px;
      max-height: 160px;
      outline: none;
    }
    .action-btn {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid transparent;
      cursor: pointer;
      outline: none;
      font-size: 15px;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .btn-attach {
      background: #182232;
      border-color: var(--border);
      color: var(--text-muted);
    }
    .btn-attach:hover { color: var(--text); border-color: #475569; }
    .btn-send {
      background: #5eead4;
      color: #0f172a;
    }
    .btn-send:hover { background: #2dd4bf; }
    .btn-stop {
      background: #1e293b;
      border-color: var(--border);
      color: #ef4444;
      display: none;
    }
    .btn-stop:hover { background: #334155; }
  </style>
</head>
<body>

  <!-- Left Drawer: Folders & Sessions -->
  <aside id="sidebar" class="collapsed">
    <div id="sidebar-header" class="sidebar-header">
      <span id="sidebar-title">Workspaces</span>
      <span id="sidebar-subtitle" style="font-size:11px; color:var(--text-dim);">directories</span>
    </div>
    <div id="sidebar-list" class="sidebar-scroll"></div>
  </aside>

  <!-- Main View -->
  <main id="main-view">
    <div class="top-header">
      <div class="path-info">
        <span id="cwd-display" class="path-cwd">~</span>
        <span id="filename-display" class="path-file">Loading session...</span>
      </div>
      <button id="toggle-sidebar" class="toggle-sidebar-btn" title="Toggle Sidebar">‹</button>
    </div>
    <div id="status-banner" class="status-banner" style="display:none;"></div>

    <div id="chat-scroll"></div>

    <div class="bottom-panel">
      <!-- Selectors & Telemetry Row matching pi-web 3-level cascade -->
      <div class="controls-row">
        <div class="selectors-group">
          <select id="provider-select" class="select-pill" title="Provider"></select>
          <select id="model-select" class="select-pill" title="Model"></select>
          <select id="thinking-select" class="select-pill" title="Thinking Level"></select>
        </div>
        <div id="telemetry-stats" class="status-telemetry">↑0 ↓0 $0.00 0%/1.0M</div>
      </div>

      <!-- Input box & actions -->
      <div class="input-box-row">
        <div class="input-wrapper">
          <div id="pending-images" class="pending-images-bar" style="display:none;"></div>
          <textarea id="prompt-input" rows="1" placeholder="send a message or paste images..."></textarea>
        </div>
        <input type="file" id="file-input" accept="image/*" multiple style="display:none;">
        <button id="attach-btn" class="action-btn btn-attach" title="Attach image (or paste clipboard)">📎</button>
        <button id="send-btn" class="action-btn btn-send" title="Send message">➔</button>
        <button id="stop-btn" class="action-btn btn-stop" title="Stop (Escape)">■</button>
      </div>
    </div>
  </main>

  <script>
    const chatScroll = document.getElementById("chat-scroll");
    const promptInput = document.getElementById("prompt-input");
    const sendBtn = document.getElementById("send-btn");
    const stopBtn = document.getElementById("stop-btn");
    const attachBtn = document.getElementById("attach-btn");
    const fileInput = document.getElementById("file-input");
    const pendingImagesBar = document.getElementById("pending-images");
    const toggleSidebar = document.getElementById("toggle-sidebar");
    const sidebar = document.getElementById("sidebar");
    const sidebarHeader = document.getElementById("sidebar-header");
    const sidebarList = document.getElementById("sidebar-list");
    const cwdDisplay = document.getElementById("cwd-display");
    const filenameDisplay = document.getElementById("filename-display");
    const telemetryStats = document.getElementById("telemetry-stats");
    const providerSelect = document.getElementById("provider-select");
    const modelSelect = document.getElementById("model-select");
    const thinkingSelect = document.getElementById("thinking-select");

    let isRunning = false;
    let currentAssistantBlock = null;
    let currentAssistantText = "";
    let currentThinkingText = "";
    let currentThinkingBox = null;

    let currentView = "workspaces"; // "workspaces" | "sessions"
    let selectedWorkspace = null;

    // 3-Level Cascading Selectors: Provider -> Model -> Thinking Level
    let currentProvider = "";
    let currentModelId = "";
    let availableModels = [];
    let pendingImages = []; // list of {mimeType: string, data: string, url: string}
    let userIsInteracting = false;
    let preferredThinkingLevel = "medium";

    // Sidebar Toggle
    toggleSidebar.addEventListener("click", () => {
      sidebar.classList.toggle("collapsed");
      toggleSidebar.innerText = sidebar.classList.contains("collapsed") ? "›" : "‹";
      if (!sidebar.classList.contains("collapsed") && currentView === "workspaces") {
        loadWorkspaces();
      }
    });

    // Auto-grow textarea
    promptInput.addEventListener("input", () => {
      promptInput.style.height = "auto";
      promptInput.style.height = Math.min(promptInput.scrollHeight, 160) + "px";
    });

    promptInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        submitMessage();
      } else if (e.key === "Escape" && isRunning) {
        e.preventDefault();
        abortTurn();
      }
    });

    sendBtn.addEventListener("click", submitMessage);
    stopBtn.addEventListener("click", abortTurn);
    attachBtn.addEventListener("click", () => fileInput.click());

    // File input attachment
    fileInput.addEventListener("change", (e) => {
      handleFiles(e.target.files);
      fileInput.value = "";
    });

    // Clipboard image paste
    window.addEventListener("paste", (e) => {
      const items = e.clipboardData?.items;
      if (!items) return;
      const files = [];
      for (const item of items) {
        if (item.type.indexOf("image") !== -1) {
          const file = item.getAsFile();
          if (file) files.push(file);
        }
      }
      if (files.length > 0) {
        handleFiles(files);
      }
    });

    // Drag and drop images
    window.addEventListener("dragover", (e) => e.preventDefault());
    window.addEventListener("drop", (e) => {
      e.preventDefault();
      if (e.dataTransfer?.files?.length) {
        handleFiles(e.dataTransfer.files);
      }
    });

    function handleFiles(files) {
      for (const f of files) {
        if (!f.type.startsWith("image/")) continue;
        const reader = new FileReader();
        reader.onload = (e) => {
          const result = e.target.result;
          const base64 = result.split(",")[1];
          pendingImages.push({
            mimeType: f.type,
            data: base64,
            url: result,
          });
          renderPendingImages();
        };
        reader.readAsDataURL(f);
      }
    }

    function renderPendingImages() {
      if (pendingImages.length === 0) {
        pendingImagesBar.style.display = "none";
        pendingImagesBar.innerHTML = "";
        return;
      }
      pendingImagesBar.style.display = "flex";
      pendingImagesBar.innerHTML = "";
      pendingImages.forEach((img, idx) => {
        const item = document.createElement("div");
        item.className = "pending-img-item";
        item.innerHTML = `
          <img src="${img.url}" class="pending-img-thumb" alt="attachment">
          <div class="pending-img-del" title="Remove">×</div>
        `;
        item.querySelector(".pending-img-del").addEventListener("click", () => {
          pendingImages.splice(idx, 1);
          renderPendingImages();
        });
        pendingImagesBar.appendChild(item);
      });
    }

    function setRunningState(running) {
      isRunning = running;
      if (running) {
        sendBtn.style.display = "none";
        stopBtn.style.display = "flex";
      } else {
        sendBtn.style.display = "flex";
        stopBtn.style.display = "none";
      }
    }

    function renderMarkdown(md) {
      let html = md
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/```([a-zA-Z0-9_\-\+\.]*)\n([\s\S]*?)```/g, (m, lang, code) => {
          return `<pre><code class="language-${lang}">${code.trim()}</code></pre>`;
        })
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/^### (.*$)/gim, "<h3>$1</h3>")
        .replace(/^## (.*$)/gim, "<h2>$1</h2>")
        .replace(/^# (.*$)/gim, "<h1>$1</h1>")
        .replace(/\n\n/g, "</p><p>");
      return `<p>${html}</p>`;
    }

    function appendUserMessage(text, images = []) {
      const block = document.createElement("div");
      block.className = "msg-block msg-user";

      if (text) {
        const p = document.createElement("div");
        p.className = "msg-user-text";
        p.innerText = text;
        block.appendChild(p);
      }

      if (images.length > 0) {
        const grid = document.createElement("div");
        grid.className = "msg-images-grid";
        for (const img of images) {
          const src = img.url || `data:${img.mimeType};base64,${img.data}`;
          const imgEl = document.createElement("img");
          imgEl.src = src;
          imgEl.className = "msg-image-thumb";
          imgEl.title = "Click to open full view";
          imgEl.addEventListener("click", () => window.open(src, "_blank"));
          grid.appendChild(imgEl);
        }
        block.appendChild(grid);
      }

      chatScroll.appendChild(block);
      chatScroll.scrollTop = chatScroll.scrollHeight;
    }

    function appendErrorMessage(errorText) {
      const block = document.createElement("div");
      block.className = "msg-block msg-error";
      block.innerHTML = `<strong>Error:</strong> ${escapeHtml(errorText)}`;
      chatScroll.appendChild(block);
      chatScroll.scrollTop = chatScroll.scrollHeight;
    }

    function ensureAssistantBlock() {
      if (!currentAssistantBlock) {
        currentAssistantBlock = document.createElement("div");
        currentAssistantBlock.className = "msg-block msg-assistant prose";
        chatScroll.appendChild(currentAssistantBlock);
      }
      return currentAssistantBlock;
    }

    // Network: WebSocket (Full-duplex RPC) with SSE fallback
    let ws = null;
    let wsConnected = false;

    function initNetwork() {
      const protocol = location.protocol === "https:" ? "wss:" : "ws:";
      const wsUrl = `${protocol}//${location.host}/ws`;

      try {
        ws = new WebSocket(wsUrl);
        ws.onopen = () => {
          wsConnected = true;
          loadModels();
        };
        ws.onmessage = (e) => {
          try {
            const data = JSON.parse(e.data);
            if (data.type === "models") {
              populateProviders(data.models);
            } else {
              onEvent(data);
            }
          } catch (err) {}
        };
        ws.onclose = () => {
          wsConnected = false;
          setTimeout(initNetwork, 2000);
        };
        ws.onerror = () => {
          wsConnected = false;
          initSseFallback();
        };
      } catch (err) {
        initSseFallback();
      }
    }

    let sseStarted = false;
    function initSseFallback() {
      if (sseStarted || wsConnected) return;
      sseStarted = true;
      const es = new EventSource("/api/events");
      es.onmessage = (e) => {
        try {
          const evt = JSON.parse(e.data);
          onEvent(evt);
        } catch (err) {}
      };
      es.onerror = () => setTimeout(() => { sseStarted = false; initSseFallback(); }, 3000);
    }

    function onEvent(evt) {
      if (evt.type === "agent_start" || evt.type === "turn_start") {
        setRunningState(true);
      } else if (evt.type === "agent_end" || evt.type === "turn_end") {
        setRunningState(false);
        currentAssistantBlock = null;
        currentAssistantText = "";
        currentThinkingText = "";
        currentThinkingBox = null;
        refreshState();
        if (evt.error) {
          appendErrorMessage(evt.error);
        }
      } else if (evt.type === "thinking_delta") {
        currentThinkingText += evt.delta || "";
        const box = ensureAssistantBlock();
        if (!currentThinkingBox) {
          currentThinkingBox = document.createElement("details");
          currentThinkingBox.className = "thinking-box";
          currentThinkingBox.open = true;
          currentThinkingBox.innerHTML = "<summary>Thinking...</summary><div class=\"thinking-content\"></div>";
          box.insertBefore(currentThinkingBox, box.firstChild);
        }
        currentThinkingBox.querySelector(".thinking-content").innerText = currentThinkingText;
        chatScroll.scrollTop = chatScroll.scrollHeight;
      } else if (evt.type === "text_delta") {
        currentAssistantText += evt.delta || "";
        const box = ensureAssistantBlock();
        let prose = box.querySelector(".assistant-prose");
        if (!prose) {
          prose = document.createElement("div");
          prose.className = "assistant-prose";
          box.appendChild(prose);
        }
        prose.innerHTML = renderMarkdown(currentAssistantText);
        chatScroll.scrollTop = chatScroll.scrollHeight;
      } else if (evt.type === "tool_execution_start") {
        currentAssistantBlock = null;
        currentAssistantText = "";

        const card = createToolCard(evt);
        chatScroll.appendChild(card);
        chatScroll.scrollTop = chatScroll.scrollHeight;
      } else if (evt.type === "tool_execution_update") {
        updateToolCardProgress(evt);
      } else if (evt.type === "tool_execution_end") {
        updateToolCard(evt);
        currentAssistantBlock = null;
        currentAssistantText = "";
      } else if (evt.type === "retry_start") {
        showStatusBanner(`⟳ Retrying in ${Math.round(evt.delaySeconds)}s (attempt ${evt.attempt}/${evt.maxAttempts}): ${evt.error}`);
      } else if (evt.type === "retry_end") {
        hideStatusBanner();
        refreshState();
      } else if (evt.type === "auto_compaction_start") {
        showStatusBanner(`Context is full — compacting conversation summary...`);
      } else if (evt.type === "auto_compaction_end") {
        hideStatusBanner();
        refreshState();
      } else if (evt.type === "session_info_changed") {
        refreshState();
      }
    }

    function createToolCard(evt) {
      const card = document.createElement("div");
      card.id = `tool-${evt.toolCallId}`;
      card.className = "tool-card";

      let title = evt.toolName;
      let bodyHtml = "";

      if (evt.toolName === "bash") {
        const cmd = evt.arguments?.command || "";
        const timeout = evt.arguments?.timeout;
        title = `$ ${cmd}` + (timeout ? ` (timeout ${timeout}s)` : "");
        bodyHtml = `<div class="tool-terminal">... executing command</div>`;
      } else if (evt.toolName === "read") {
        const path = evt.arguments?.path || "";
        const offset = evt.arguments?.offset;
        title = `read ${path}` + (offset ? `:${offset}` : "");
        bodyHtml = `<div class="tool-terminal">Reading file...</div>`;
      } else if (evt.toolName === "edit") {
        const path = evt.arguments?.path || "";
        const oldText = evt.arguments?.oldText || "";
        const newText = evt.arguments?.newText || "";
        title = `edit ${path}`;
        bodyHtml = renderDiff(oldText, newText);
      } else if (evt.toolName === "write") {
        const path = evt.arguments?.path || "";
        title = `write ${path}`;
        bodyHtml = `<div class="tool-terminal">Writing to file...</div>`;
      } else if (evt.toolName === "grep") {
        const pattern = evt.arguments?.pattern || "";
        title = `grep /${pattern}/`;
        bodyHtml = `<div class="tool-terminal">Searching...</div>`;
      } else {
        bodyHtml = `<pre><code>${escapeHtml(JSON.stringify(evt.arguments || {}, null, 2))}</code></pre>`;
      }

      card.innerHTML = `
        <div class="tool-header">
          <span class="tool-header-title">${escapeHtml(title)}</span>
          <span class="tool-header-status">Running...</span>
        </div>
        <div class="tool-body">${bodyHtml}</div>
      `;

      card.querySelector(".tool-header").addEventListener("click", () => {
        const body = card.querySelector(".tool-body");
        body.style.display = body.style.display === "none" ? "block" : "none";
      });

      return card;
    }

    function updateToolCard(evt) {
      const card = document.getElementById(`tool-${evt.toolCallId}`);
      if (!card) return;

      const statusEl = card.querySelector(".tool-header-status");
      statusEl.innerText = evt.isError ? "Failed" : "Done";
      statusEl.style.color = evt.isError ? "#ef4444" : "#94a3b8";

      const body = card.querySelector(".tool-body");
      if (evt.result !== undefined && evt.result !== null) {
        if (typeof evt.result === "string") {
          body.innerHTML = `<div class="tool-terminal">${escapeHtml(evt.result)}</div>`;
        } else if (evt.result.diff) {
          body.innerHTML = renderDiffFromUnified(evt.result.diff);
        } else if (evt.result.output) {
          body.innerHTML = `<div class="tool-terminal">${escapeHtml(evt.result.output)}</div>`;
        } else {
          body.innerHTML = `<div class="tool-terminal">${escapeHtml(JSON.stringify(evt.result, null, 2))}</div>`;
        }
      }
    }

    function updateToolCardProgress(evt) {
      const card = document.getElementById(`tool-${evt.toolCallId}`);
      if (!card) return;

      const body = card.querySelector(".tool-body");
      if (body && evt.output) {
        body.innerHTML = `<div class="tool-terminal">${escapeHtml(evt.output)}</div>`;
        body.scrollTop = body.scrollHeight;
      }
    }

    function showStatusBanner(text) {
      const banner = document.getElementById("status-banner");
      if (banner) {
        banner.innerText = text;
        banner.style.display = "flex";
      }
    }

    function hideStatusBanner() {
      const banner = document.getElementById("status-banner");
      if (banner) {
        banner.style.display = "none";
        banner.innerText = "";
      }
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function renderDiff(oldText, newText) {
      const oldLines = oldText ? oldText.split("\n") : [];
      const newLines = newText ? newText.split("\n") : [];
      let html = '<div class="diff-container">';
      for (const line of oldLines) {
        html += `<div class="diff-line diff-del">- ${escapeHtml(line)}</div>`;
      }
      for (const line of newLines) {
        html += `<div class="diff-line diff-add">+ ${escapeHtml(line)}</div>`;
      }
      html += '</div>';
      return html;
    }

    function renderDiffFromUnified(unified) {
      const lines = String(unified).split("\n");
      let html = '<div class="diff-container">';
      for (const line of lines) {
        if (line.startsWith("+")) {
          html += `<div class="diff-line diff-add">${escapeHtml(line)}</div>`;
        } else if (line.startsWith("-")) {
          html += `<div class="diff-line diff-del">${escapeHtml(line)}</div>`;
        } else {
          html += `<div class="diff-line diff-ctx">${escapeHtml(line)}</div>`;
        }
      }
      html += '</div>';
      return html;
    }

    async function submitMessage() {
      const text = promptInput.value.trim();
      const imgsToSend = [...pendingImages];

      if (!text && imgsToSend.length === 0) return;

      promptInput.value = "";
      promptInput.style.height = "38px";
      pendingImages = [];
      renderPendingImages();

      appendUserMessage(text, imgsToSend);
      setRunningState(true);

      const payload = {
        type: "prompt",
        message: text,
        images: imgsToSend.map(img => ({ type: "image", mimeType: img.mimeType, data: img.data })),
      };

      if (wsConnected && ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(payload));
      } else {
        await fetch("/api/prompt", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
      }
    }

    async function abortTurn() {
      if (wsConnected && ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "abort" }));
      } else {
        await fetch("/api/abort", { method: "POST" });
      }
    }

    async function refreshState() {
      try {
        const res = await fetch("/api/state");
        const d = await res.json();
        applyState(d);
      } catch (err) {}
    }

    function applyState(d) {
      if (!d) return;
      cwdDisplay.innerText = d.cwd || "~";
      filenameDisplay.innerText = d.sessionFile || d.sessionName || "Active Session";
      telemetryStats.innerText = `↑${formatK(d.tokensIn)} ↓${formatK(d.tokensOut)} $${d.cost} ${d.contextPercent}%/${d.contextWindow}`;

      if (userIsInteracting) return;

      if (d.provider && availableModels.length > 0 && providerSelect.value !== d.provider) {
        currentProvider = d.provider;
        providerSelect.value = d.provider;
        updateModelsForProvider(d.provider, d.model);
      } else if (d.model && availableModels.length > 0 && modelSelect.value !== d.model) {
        currentModelId = d.model;
        modelSelect.value = d.model;
        updateThinkingLevels(d.model, d.thinkingLevel);
      } else if (d.thinkingLevel && thinkingSelect.value !== d.thinkingLevel) {
        thinkingSelect.value = d.thinkingLevel;
      }
    }

    function formatK(n) {
      if (n < 1000) return n;
      if (n < 1000000) return (n / 1000).toFixed(1) + "k";
      return (n / 1000000).toFixed(1) + "M";
    }

    // 3-Level Cascading Selectors: Provider -> Model -> Thinking Level
    async function loadModels() {
      try {
        const res = await fetch("/api/models");
        availableModels = await res.json();
        populateProviders(availableModels);
      } catch (err) {}
    }

    function populateProviders(models) {
      const providers = [...new Set(models.map(m => m.provider))].filter(Boolean);
      providerSelect.innerHTML = "";
      for (const p of providers) {
        const opt = document.createElement("option");
        opt.value = p;
        opt.innerText = p;
        providerSelect.appendChild(opt);
      }

      if (currentProvider && providers.includes(currentProvider)) {
        providerSelect.value = currentProvider;
      } else if (providers.includes("antigravity")) {
        providerSelect.value = "antigravity";
      } else if (providers.length > 0) {
        providerSelect.value = providers[0];
      }

      currentProvider = providerSelect.value;
      updateModelsForProvider(currentProvider, currentModelId);
    }

    function updateModelsForProvider(provider, targetModelId = null) {
      const filtered = availableModels.filter(m => m.provider === provider);
      modelSelect.innerHTML = "";

      for (const m of filtered) {
        const opt = document.createElement("option");
        opt.value = m.id;
        opt.innerText = m.id;
        modelSelect.appendChild(opt);
      }

      if (targetModelId && filtered.some(m => m.id === targetModelId)) {
        modelSelect.value = targetModelId;
      } else if (filtered.length > 0) {
        modelSelect.value = filtered[0].id;
      }

      currentModelId = modelSelect.value;
      updateThinkingLevels(currentModelId);
    }

    function updateThinkingLevels(modelId, targetLevel = null) {
      const model = availableModels.find(m => m.id === modelId);
      const levels = model?.thinkingLevels || ["off", "low", "medium", "high"];
      const canReason = model ? (model.reasoning && levels.some(l => l !== "off")) : true;

      thinkingSelect.innerHTML = "";
      for (const lvl of levels) {
        const opt = document.createElement("option");
        opt.value = lvl;
        opt.innerText = lvl;
        thinkingSelect.appendChild(opt);
      }

      // Determine active level preserving user preference
      let chosen = null;

      if (targetLevel && levels.includes(targetLevel)) {
        chosen = targetLevel;
      } else if (canReason) {
        // If model supports thinking, NEVER default to off!
        if (levels.includes(preferredThinkingLevel)) {
          chosen = preferredThinkingLevel;
        } else if (levels.includes("medium")) {
          chosen = "medium";
        } else if (levels.includes("high")) {
          chosen = "high";
        } else {
          // First non-off level available
          chosen = levels.find(l => l !== "off") || levels[0] || "medium";
        }
      } else {
        // Non-reasoning model can only be off
        chosen = "off";
      }

      thinkingSelect.value = chosen;
      if (chosen !== "off") {
        preferredThinkingLevel = chosen;
      }
    }

    providerSelect.addEventListener("change", () => {
      currentProvider = providerSelect.value;
      updateModelsForProvider(currentProvider);
      sendModelChange();
    });

    modelSelect.addEventListener("change", () => {
      currentModelId = modelSelect.value;
      updateThinkingLevels(currentModelId);
      sendModelChange();
    });

    thinkingSelect.addEventListener("change", async () => {
      const level = thinkingSelect.value;
      if (level !== "off") {
        preferredThinkingLevel = level;
      }
      const msg = {
        type: "set_thinking_level",
        level: level,
      };

      if (wsConnected && ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(msg));
      }

      try {
        const res = await fetch("/api/thinking", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ level }),
        });
        const d = await res.json();
        if (d && d.state) {
          applyState(d.state);
        }
      } catch (err) {}
    });

    async function sendModelChange() {
      userIsInteracting = true;
      const modelId = modelSelect.value;
      const provider = providerSelect.value;
      const thinkingLevel = thinkingSelect.value;
      const msg = {
        type: "set_model",
        modelId,
        provider,
        thinkingLevel,
      };

      if (wsConnected && ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(msg));
      }

      try {
        const res = await fetch("/api/model", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ modelId, provider, thinkingLevel }),
        });
        const d = await res.json();
        if (d && d.state) {
          userIsInteracting = false;
          applyState(d.state);
        }
      } catch (err) {
      } finally {
        setTimeout(() => { userIsInteracting = false; }, 300);
      }
    }

    // 1. Level 1: Workspaces/Directories
    async function loadWorkspaces() {
      currentView = "workspaces";
      sidebarHeader.innerHTML = `
        <span style="font-weight:600;">Workspaces</span>
        <span style="font-size:11px; color:var(--text-dim);">directories</span>
      `;
      sidebarList.innerHTML = `<div style="padding:12px; color:var(--text-dim); font-size:12px;">Loading directories...</div>`;

      try {
        const res = await fetch("/api/folders");
        const data = await res.json();
        sidebarList.innerHTML = "";

        for (const ws of data.workspaces || []) {
          const item = document.createElement("div");
          item.className = "drawer-item" + (ws.isCurrent ? " active" : "");
          item.innerHTML = `
            <span class="drawer-label" title="${ws.path}">${ws.name}</span>
            <span class="drawer-badge">${ws.sessionCount} sessions</span>
          `;
          item.addEventListener("click", () => enterWorkspace(ws));
          sidebarList.appendChild(item);
        }
      } catch (err) {
        sidebarList.innerHTML = `<div style="padding:12px; color:var(--error); font-size:12px;">Failed to load folders</div>`;
      }
    }

    // 2. Level 2: Sessions under chosen workspace
    async function enterWorkspace(ws) {
      currentView = "sessions";
      selectedWorkspace = ws;
      sidebarHeader.innerHTML = `
        <button id="back-folders" class="back-btn">‹ Workspaces</button>
        <span style="font-size:12px; font-weight:600; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${ws.name}</span>
      `;
      document.getElementById("back-folders").addEventListener("click", loadWorkspaces);

      sidebarList.innerHTML = `<div style="padding:12px; color:var(--text-dim); font-size:12px;">Loading sessions...</div>`;

      try {
        const res = await fetch(`/api/sessions?cwd=${encodeURIComponent(ws.path)}`);
        const sessions = await res.json();
        sidebarList.innerHTML = "";

        if (sessions.length === 0) {
          sidebarList.innerHTML = `<div style="padding:12px; color:var(--text-dim); font-size:12px;">No sessions in this folder</div>`;
          return;
        }

        for (const s of sessions) {
          const item = document.createElement("div");
          item.className = "drawer-item";
          item.innerHTML = `
            <span class="drawer-label" title="${s.filename}">${s.opening || s.filename}</span>
          `;
          item.addEventListener("click", () => switchSession(s.path, s.filename, ws.path));
          sidebarList.appendChild(item);
        }
      } catch (err) {
        sidebarList.innerHTML = `<div style="padding:12px; color:var(--error); font-size:12px;">Failed to load sessions</div>`;
      }
    }

    async function switchSession(path, filename, cwd) {
      filenameDisplay.innerText = filename;
      chatScroll.innerHTML = "";
      await fetch("/api/session/switch", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ path }),
      });
      loadMessages();
      refreshState();
    }

    async function loadMessages() {
      try {
        const res = await fetch("/api/messages");
        const msgs = await res.json();
        chatScroll.innerHTML = "";
        for (const m of msgs) {
          if (m.role === "user") {
            let text = "";
            let images = [];
            if (typeof m.content === "string") {
              text = m.content;
            } else if (Array.isArray(m.content)) {
              for (const c of m.content) {
                if (c.type === "text") text += c.text || "";
                if (c.type === "image") images.push(c);
              }
            }
            appendUserMessage(text, images);
          } else if (m.role === "assistant") {
            if (Array.isArray(m.content)) {
              for (const c of m.content) {
                if (c.type === "thinking" && c.text) {
                  const box = document.createElement("details");
                  box.className = "thinking-box";
                  box.innerHTML = `<summary>Thinking...</summary><div class="thinking-content">${escapeHtml(c.text)}</div>`;
                  chatScroll.appendChild(box);
                } else if (c.type === "tool_call") {
                  const card = createToolCard({
                    toolCallId: c.id,
                    toolName: c.name,
                    arguments: c.arguments,
                  });
                  chatScroll.appendChild(card);
                } else if (c.type === "text" && c.text) {
                  const block = document.createElement("div");
                  block.className = "msg-block msg-assistant prose";
                  block.innerHTML = renderMarkdown(c.text);
                  chatScroll.appendChild(block);
                }
              }
            }
            if (m.stopReason === "error" && m.errorMessage) {
              appendErrorMessage(m.errorMessage);
            }
          } else if (m.role === "tool_result") {
            updateToolCard({
              toolCallId: m.toolCallId,
              result: m.result || m.details,
              isError: m.isError,
            });
          }
        }
        chatScroll.scrollTop = chatScroll.scrollHeight;
      } catch (err) {}
    }

    initNetwork();
    loadModels();
    refreshState();
    loadMessages();
  </script>
</body>
</html>
