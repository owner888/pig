<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pig web</title>
  <style>
    :root {
      --bg: #0f172a;
      --bg-surface: #1e293b;
      --bg-surface-hover: #334155;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --user-bubble: #1e293b;
      --assistant-bubble: transparent;
      --warning: #f59e0b;
      --error: #ef4444;
      --success: #10b981;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Bar */
    header {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
    }
    .pig-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      color: var(--text);
      font-size: 15px;
      letter-spacing: -0.02em;
    }
    .pig-badge span.logo {
      background: #f43f5e;
      color: #fff;
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-weight: bold;
    }
    .session-path {
      color: var(--text-muted);
      font-size: 13px;
      font-family: var(--font-mono);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 9999px;
      background: rgba(16, 185, 129, 0.1);
      color: var(--success);
      font-family: var(--font-mono);
    }
    .status-pill.busy {
      background: rgba(245, 158, 11, 0.1);
      color: var(--warning);
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    /* Chat Messages Area */
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }

    .msg-row {
      display: flex;
      flex-direction: column;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
      animation: fadeIn 0.15s ease-out;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    .msg-user {
      align-self: flex-end;
      background: var(--user-bubble);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      max-width: 80%;
      font-size: 15px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg-assistant {
      align-self: flex-start;
      width: 100%;
      font-size: 15px;
      line-height: 1.65;
      word-break: break-word;
    }

    .thinking-box {
      background: rgba(15, 23, 42, 0.5);
      border-left: 2px solid var(--border);
      padding: 8px 12px;
      margin-bottom: 12px;
      border-radius: 4px;
      font-size: 13px;
      color: var(--text-dim);
      font-style: italic;
      white-space: pre-wrap;
    }
    .thinking-box summary {
      cursor: pointer;
      font-weight: 500;
      color: var(--text-muted);
      user-select: none;
      outline: none;
      list-style: none;
    }
    .thinking-box summary::-webkit-details-marker { display: none; }
    .thinking-box summary::before {
      content: "▶ ";
      font-size: 10px;
      display: inline-block;
      transition: transform 0.15s;
    }
    .thinking-box[open] summary::before { transform: rotate(90deg); }

    .tool-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin: 10px 0;
      overflow: hidden;
      font-family: var(--font-mono);
      font-size: 13px;
    }
    .tool-header {
      padding: 8px 12px;
      background: rgba(51, 65, 85, 0.4);
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-muted);
    }
    .tool-name { font-weight: 600; color: var(--accent); }
    .tool-body {
      padding: 10px 12px;
      white-space: pre-wrap;
      word-break: break-all;
      color: var(--text);
      max-height: 280px;
      overflow-y: auto;
    }

    /* Markdown inside assistant */
    .prose p { margin-bottom: 0.85em; }
    .prose p:last-child { margin-bottom: 0; }
    .prose pre {
      background: #090d16;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      margin: 10px 0;
      overflow-x: auto;
      font-family: var(--font-mono);
      font-size: 13.5px;
      line-height: 1.5;
    }
    .prose code {
      font-family: var(--font-mono);
      background: rgba(51, 65, 85, 0.5);
      padding: 2px 5px;
      border-radius: 4px;
      font-size: 0.9em;
    }
    .prose pre code { background: transparent; padding: 0; font-size: inherit; }
    .prose ul, .prose ol { margin-left: 20px; margin-bottom: 0.85em; }
    .prose li { margin-bottom: 0.25em; }
    .prose h1, .prose h2, .prose h3 { margin-top: 1em; margin-bottom: 0.5em; font-weight: 600; }
    .prose hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }

    /* Input & Bottom Controls */
    .bottom-bar {
      background: var(--bg-surface);
      border-top: 1px solid var(--border);
      padding: 14px 20px 8px;
      flex-shrink: 0;
    }
    .input-wrapper {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    #prompt-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 15px;
      line-height: 1.5;
      resize: none;
      min-height: 44px;
      max-height: 180px;
      outline: none;
      transition: border-color 0.15s;
    }
    #prompt-input:focus { border-color: var(--accent); }
    .btn {
      height: 44px;
      padding: 0 18px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: none;
      transition: all 0.15s;
      outline: none;
      white-space: nowrap;
    }
    .btn-send { background: var(--accent); color: #0f172a; }
    .btn-send:hover { background: var(--accent-hover); }
    .btn-abort { background: var(--error); color: #fff; display: none; }
    .btn-abort:hover { opacity: 0.9; }

    /* Footer Telemetry line */
    .footer-telemetry {
      max-width: 860px;
      margin: 6px auto 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-dim);
      font-size: 12px;
      font-family: var(--font-mono);
    }
    .telemetry-left { display: flex; gap: 8px; align-items: center; }
    .telemetry-right { color: var(--text-muted); }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <div class="pig-badge"><span class="logo">PIG</span> web</div>
      <div id="session-info" class="session-path">~/loading...</div>
    </div>
    <div class="header-right">
      <div id="model-tag" class="session-path" style="color:var(--text-muted);">(loading model...)</div>
      <div id="status-pill" class="status-pill"><div class="status-dot"></div><span id="status-text">Ready</span></div>
    </div>
  </header>

  <div id="chat-container"></div>

  <div class="bottom-bar">
    <div class="input-wrapper">
      <div class="input-row">
        <textarea id="prompt-input" rows="1" placeholder="Type a message or command (Enter to send, Shift+Enter for newline)..."></textarea>
        <button id="send-btn" class="btn btn-send">Send</button>
        <button id="abort-btn" class="btn btn-abort">Abort</button>
      </div>
      <div class="footer-telemetry">
        <div id="telemetry-left" class="telemetry-left">↑0 ↓0 $0.000 0.0%/1.0M</div>
        <div id="telemetry-right" class="telemetry-right">⚡ -- tok/s</div>
      </div>
    </div>
  </div>

  <script>
    const chatContainer = document.getElementById("chat-container");
    const promptInput = document.getElementById("prompt-input");
    const sendBtn = document.getElementById("send-btn");
    const abortBtn = document.getElementById("abort-btn");
    const sessionInfo = document.getElementById("session-info");
    const modelTag = document.getElementById("model-tag");
    const statusPill = document.getElementById("status-pill");
    const statusText = document.getElementById("status-text");
    const telemetryLeft = document.getElementById("telemetry-left");
    const telemetryRight = document.getElementById("telemetry-right");

    let isStreaming = false;
    let currentAssistantRow = null;
    let currentAssistantText = "";
    let currentThinkingText = "";
    let currentThinkingDetails = null;

    promptInput.addEventListener("input", () => {
      promptInput.style.height = "auto";
      promptInput.style.height = Math.min(promptInput.scrollHeight, 180) + "px";
    });

    promptInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        submitPrompt();
      } else if (e.key === "Escape" && isStreaming) {
        e.preventDefault();
        abortCurrentTurn();
      }
    });

    sendBtn.addEventListener("click", submitPrompt);
    abortBtn.addEventListener("click", abortCurrentTurn);

    function setBusy(busy) {
      isStreaming = busy;
      if (busy) {
        statusPill.classList.add("busy");
        statusText.innerText = "Working...";
        sendBtn.style.display = "none";
        abortBtn.style.display = "inline-flex";
      } else {
        statusPill.classList.remove("busy");
        statusText.innerText = "Ready";
        sendBtn.style.display = "inline-flex";
        abortBtn.style.display = "none";
      }
    }

    function appendUserMessage(text) {
      const row = document.createElement("div");
      row.className = "msg-row";
      const bubble = document.createElement("div");
      bubble.className = "msg-user";
      bubble.innerText = text;
      row.appendChild(bubble);
      chatContainer.appendChild(row);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function ensureAssistantRow() {
      if (!currentAssistantRow) {
        currentAssistantRow = document.createElement("div");
        currentAssistantRow.className = "msg-row";
        const bubble = document.createElement("div");
        bubble.className = "msg-assistant prose";
        currentAssistantRow.appendChild(bubble);
        chatContainer.appendChild(currentAssistantRow);
      }
      return currentAssistantRow.querySelector(".msg-assistant");
    }

    function renderMarkdown(md) {
      let html = md
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/```([a-zA-Z0-9_\-\+\.]*)\n([\s\S]*?)```/g, (m, lang, code) => {
          return `<pre><code class="language-${lang}">${code.trim()}</code></pre>`;
        })
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/^### (.*$)/gim, "<h3>$1</h3>")
        .replace(/^## (.*$)/gim, "<h2>$1</h2>")
        .replace(/^# (.*$)/gim, "<h1>$1</h1>")
        .replace(/^\s*[-*+]\s+(.*$)/gim, "<ul><li>$1</li></ul>")
        .replace(/<\/ul>\s*<ul>/g, "")
        .replace(/\n\n/g, "</p><p>");
      return `<p>${html}</p>`;
    }

    function connectEvents() {
      const es = new EventSource("/api/events");
      es.onmessage = (e) => {
        try {
          const evt = JSON.parse(e.data);
          handleEvent(evt);
        } catch (err) {}
      };
      es.onerror = () => {
        setTimeout(connectEvents, 2000);
      };
    }

    function handleEvent(evt) {
      if (evt.type === "agent_start" || evt.type === "turn_start") {
        setBusy(true);
      } else if (evt.type === "agent_end" || evt.type === "turn_end") {
        setBusy(false);
        currentAssistantRow = null;
        currentAssistantText = "";
        currentThinkingText = "";
        currentThinkingDetails = null;
        refreshState();
      } else if (evt.type === "thinking_delta") {
        currentThinkingText += evt.delta || "";
        const bubble = ensureAssistantRow();
        if (!currentThinkingDetails) {
          currentThinkingDetails = document.createElement("details");
          currentThinkingDetails.className = "thinking-box";
          currentThinkingDetails.open = true;
          const summary = document.createElement("summary");
          summary.innerText = "Thinking...";
          currentThinkingDetails.appendChild(summary);
          const p = document.createElement("div");
          p.className = "thinking-content";
          currentThinkingDetails.appendChild(p);
          bubble.insertBefore(currentThinkingDetails, bubble.firstChild);
        }
        currentThinkingDetails.querySelector(".thinking-content").innerText = currentThinkingText;
        chatContainer.scrollTop = chatContainer.scrollHeight;
      } else if (evt.type === "text_delta") {
        currentAssistantText += evt.delta || "";
        const bubble = ensureAssistantRow();
        let proseDiv = bubble.querySelector(".prose-content");
        if (!proseDiv) {
          proseDiv = document.createElement("div");
          proseDiv.className = "prose-content";
          bubble.appendChild(proseDiv);
        }
        proseDiv.innerHTML = renderMarkdown(currentAssistantText);
        chatContainer.scrollTop = chatContainer.scrollHeight;
      } else if (evt.type === "tool_execution_start") {
        const bubble = ensureAssistantRow();
        const card = document.createElement("div");
        card.id = `tool-${evt.toolCallId}`;
        card.className = "tool-card";
        card.innerHTML = `<div class="tool-header"><span class="tool-name">${evt.toolName}</span><span>Running...</span></div><div class="tool-body">${JSON.stringify(evt.arguments || {}, null, 2)}</div>`;
        bubble.appendChild(card);
        chatContainer.scrollTop = chatContainer.scrollHeight;
      } else if (evt.type === "tool_execution_end") {
        const card = document.getElementById(`tool-${evt.toolCallId}`);
        if (card) {
          card.querySelector(".tool-header span:last-child").innerText = evt.isError ? "Failed" : "Completed";
          card.querySelector(".tool-body").innerText = typeof evt.result === "string" ? evt.result : JSON.stringify(evt.result || {}, null, 2);
        }
      } else if (evt.type === "session_info_changed") {
        refreshState();
      }
    }

    async function submitPrompt() {
      const text = promptInput.value.trim();
      if (!text) return;
      promptInput.value = "";
      promptInput.style.height = "44px";
      appendUserMessage(text);
      setBusy(true);

      await fetch("/api/prompt", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text }),
      });
    }

    async function abortCurrentTurn() {
      await fetch("/api/abort", { method: "POST" });
    }

    async function refreshState() {
      try {
        const res = await fetch("/api/state");
        const data = await res.json();
        if (data.sessionName) {
          sessionInfo.innerText = `${data.cwd} (${data.branch}) • ${data.sessionName}`;
        } else {
          sessionInfo.innerText = `${data.cwd} (${data.branch})`;
        }
        modelTag.innerText = `(${data.provider}) ${data.model} • ${data.thinkingLevel}`;
        telemetryLeft.innerText = `↑${data.tokensIn} ↓${data.tokensOut} $${data.cost} ${data.contextPercent}%/${data.contextWindow}`;
        if (data.speed) {
          telemetryRight.innerText = data.speed;
        }
      } catch (err) {}
    }

    async function loadHistory() {
      try {
        const res = await fetch("/api/messages");
        const msgs = await res.json();
        for (const msg of msgs) {
          if (msg.role === "user") {
            const text = typeof msg.content === "string" ? msg.content : (msg.content?.[0]?.text || "");
            appendUserMessage(text);
          } else if (msg.role === "assistant") {
            const text = msg.content?.filter(c => c.type === "text").map(c => c.text).join("") || "";
            if (text) {
              const row = document.createElement("div");
              row.className = "msg-row";
              const bubble = document.createElement("div");
              bubble.className = "msg-assistant prose";
              bubble.innerHTML = renderMarkdown(text);
              row.appendChild(bubble);
              chatContainer.appendChild(row);
            }
          }
        }
      } catch (err) {}
    }

    connectEvents();
    refreshState();
    loadHistory();
  </script>
</body>
</html>
